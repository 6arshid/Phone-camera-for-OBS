name: PhoneCamera
options:
  bundleIdPrefix: com.obsphonecamera
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  PhoneCamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Support/Info.plist
        buildPhase: none
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsphonecamera.app
        PRODUCT_NAME: Phone Camera
        PRODUCT_MODULE_NAME: PhoneCamera
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DISABLE_ASSET_SYMBOL_GENERATION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  PhoneCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ProtocolTests
    dependencies:
      - target: PhoneCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsphonecamera.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoneCamera:
    build:
      targets:
        PhoneCamera: all
        PhoneCameraTests: [test]
    test:
      targets:
        - PhoneCameraTests
    run:
      config: Debug
